version: '3.8'

services:
  cmms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cmms-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./prisma/dev.db
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - ./prisma:/app/prisma
      - ./storage:/app/storage
    networks:
      - cmms-network

networks:
  cmms-network:
    driver: bridge
